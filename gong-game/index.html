<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GONG Demo</title>
  <link rel="stylesheet" href="style.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Spine Web Player -->
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/iife/spine-player.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/spine-player.css"/>
</head>
<body>

  <div class="scene">
    <img
      id="fade-image"
      src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80"
      alt="Landscape"
      class="hero-image"
    />

    <div id="btn-wrapper" class="btn-wrapper hidden">
      <button id="play-btn" class="play-btn">▶ Play Spine Animation</button>
    </div>

    <div id="spine-wrapper" class="spine-wrapper hidden">
      <div id="spine-player"></div>
      <button id="close-btn" class="close-btn">✕ Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
